packages:
  - packages/*

catalogs:
  default:
    '@bufbuild/buf': 1.75.0
    '@bufbuild/protobuf': 2.17.0
    '@bufbuild/protoc-gen-es': 2.17.0
    '@bufbuild/protoplugin': 2.17.0
    '@connectrpc/connect': 2.3.0
    '@connectrpc/connect-node': 2.3.0
    '@effect/language-service': 0.87.5
    '@effect/opentelemetry': 4.1.5
    '@effect/platform-node': 4.1.5
    '@effect/vitest': 4.1.5
    '@opentelemetry/api': 1.9.0
    '@opentelemetry/core': 2.0.0
    # What @effect/opentelemetry's NodeSdk loads. They are optional peers of @effect/opentelemetry 4, so no
    # package manager installs them on its own.
    '@opentelemetry/api-logs': 0.223.0
    '@opentelemetry/resources': 2.12.0
    '@opentelemetry/sdk-logs': 0.223.0
    '@opentelemetry/sdk-metrics': 2.12.0
    '@opentelemetry/sdk-trace-base': 2.12.0
    '@opentelemetry/sdk-trace-node': 2.12.0
    '@types/node': 24.4.0
    effect: 4.1.5
    typescript: 5.9.2
    vitest: 5.1.1
  peer:
    "@bufbuild/buf": ^1.75.0
    "@bufbuild/protoc-gen-es": ^2.17.0
    '@bufbuild/protobuf': ^2.17.0
    '@connectrpc/connect': ^2.3.0
    # The library's tests pass from 4.0.7, with effect and this package at the same release. 4.0.0 and
    # 4.0.1 of this package load @opentelemetry/resources, so the server cannot start. With 4.0.2 to 4.0.6 of
    # both, two cases that the unit tests pin send another status or message. Its own peer on effect is
    # ^4.0.7, so an install needs effect 4.0.7 or later.
    '@effect/opentelemetry': ^4.0.7
    effect: ^4.0.0
