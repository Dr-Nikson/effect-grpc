# .github/workflows/release.yml
name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Typescript CI"]
    types: [completed]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  version-pr:
    name: Create Version PR
    # `branches: [master]` filters only on the triggering run's head branch name, not on its
    # event or its repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_unpublished: ${{ steps.check-unpublished.outputs.has_unpublished }}
      dist_tag_behind: ${{ steps.check-dist-tag.outputs.behind }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove executable bit from bin files
        run: |
          echo "Removing executable bit from bin files for github-api commit mode..."
          find packages/*/bin -type f -exec chmod -x {} \; 2>/dev/null || true
          echo "✅ Executable bits removed"

      - name: Find the open version PR
        id: open-version-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NUMBER=$(gh pr list --head changeset-release/master --base master --state open --json number --jq '.[0].number // empty')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action sets pullRequestNumber only when it created or updated a version PR.
      # hasChangesets is also true when every pending changeset is empty.
      - name: Check for unpublished packages
        id: check-unpublished
        if: steps.changesets.outputs.pullRequestNumber == ''
        run: |
          echo "Checking for unpublished packages tracked by changesets..."
          HAS_UNPUBLISHED=false

          # Get ignore list from changeset config
          IGNORE_LIST=$(jq -r '.ignore // [] | .[]' .changeset/config.json)

          # Get all workspace packages via pnpm (use process substitution to avoid subshell)
          while read -r pkg; do
            PKG_NAME=$(echo "$pkg" | jq -r '.name')
            PKG_VERSION=$(echo "$pkg" | jq -r '.version')
            PKG_PRIVATE=$(echo "$pkg" | jq -r '.private // false')

            # Skip packages in changeset ignore list
            echo "$IGNORE_LIST" | grep -qx "$PKG_NAME" && continue

            # Skip private packages
            [[ "$PKG_PRIVATE" == "true" ]] && continue

            echo "Checking $PKG_NAME@$PKG_VERSION..."
            if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
              echo "✅ $PKG_NAME@$PKG_VERSION already published"
            else
              echo "📦 $PKG_NAME@$PKG_VERSION needs publishing"
              HAS_UNPUBLISHED=true
            fi
          done < <(pnpm list -r --json --depth -1 | jq -c '.[]')

          echo "has_unpublished=$HAS_UNPUBLISHED" >> $GITHUB_OUTPUT

      # A run whose dist-tag step failed leaves its version on npm, so this check lets a later run
      # move the tag.
      - name: Check the effect-v4 dist-tag
        id: check-dist-tag
        if: steps.changesets.outputs.pullRequestNumber == ''
        run: node .github/scripts/move-effect-dist-tag.mjs --check >> "$GITHUB_OUTPUT"

      - name: Log status
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          OPEN_VERSION_PR: ${{ steps.open-version-pr.outputs.number }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
          HAS_UNPUBLISHED: ${{ steps.check-unpublished.outputs.has_unpublished }}
          DIST_TAG_BEHIND: ${{ steps.check-dist-tag.outputs.behind }}
        run: |
          if [[ -n "$VERSION_PR" && "$VERSION_PR" == "$OPEN_VERSION_PR" ]]; then
            echo "Updated version PR #$VERSION_PR"
          elif [[ -n "$VERSION_PR" ]]; then
            echo "Created version PR #$VERSION_PR"
          elif [[ "$HAS_CHANGESETS" == "true" ]]; then
            echo "No version PR: every pending changeset is empty"
          else
            echo "No version PR: no pending changesets"
          fi
          if [[ "$HAS_UNPUBLISHED" == "true" ]]; then
            echo "Unpublished packages found: the publish job waits for npm-publish approval"
          elif [[ "$DIST_TAG_BEHIND" == "true" ]]; then
            echo "effect-v4 points to an older version: the publish job waits for npm-publish approval to move it"
          elif [[ -z "$VERSION_PR" ]]; then
            echo "Every package version is already on npm"
          fi

  publish:
    name: Publish to npm
    needs: version-pr
    if: >-
      needs.version-pr.outputs.has_unpublished == 'true' ||
      needs.version-pr.outputs.dist_tag_behind == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
      url: https://npmjs.com/package/@dr_nikson/effect-grpc
    permissions:
      actions: read
      contents: write # push release tags and create GitHub releases
      id-token: write # npm trusted publishing with provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-artifacts-${{ github.event.workflow_run.head_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la packages/*/dist || (echo "❌ dist folders not found" && exit 1)
          ls -la packages/*/bin || echo "⚠️  bin folders not found (may not exist)"
          echo "✅ Build artifacts restored successfully"

      - name: Remove executable bit from bin files
        run: |
          echo "Removing executable bit from bin files for consistency..."
          find packages/*/bin -type f -exec chmod -x {} \; 2>/dev/null || true
          echo "✅ Executable bits removed"

      # changesets/action publishes only when no changeset is pending, empty ones included.
      - name: Drop empty changesets
        run: node .github/scripts/drop-empty-changesets.mjs

      - name: Publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm 11.21.0 is the first npm 11 that changes a dist-tag with OIDC (npm/cli#10056). It is
      # installed after the publish, so nothing before it changes. zizmor asks for a lockfile entry
      # instead, but a root dependency would install npm in every job and replace the npm that
      # `changeset publish` calls for `npm info`.
      - name: Install npm for dist-tags
        run: npm install --global npm@11.21.0 # zizmor: ignore[adhoc-packages]

      - name: Move the effect-v4 dist-tag
        run: node .github/scripts/move-effect-dist-tag.mjs
