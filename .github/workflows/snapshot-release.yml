# .github/workflows/snapshot-release.yml
name: Snapshot Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Snapshot dist-tag: lowercase letters, digits and single hyphens, starting with a letter (e.g. mvp, pr-123)'
        required: true
        default: 'snapshot'
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  validate:
    name: Validate snapshot request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/snapshot') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.request.outputs.kind }}
      reply: ${{ steps.request.outputs.reply }}
      message: ${{ steps.request.outputs.message }}
      tag: ${{ steps.request.outputs.tag }}
      sha: ${{ steps.request.outputs.sha }}
      run-id: ${{ steps.request.outputs.run-id }}
      artifact: ${{ steps.request.outputs.artifact }}
    steps:
      # The default ref is the default branch for a comment and the dispatched ref for a
      # dispatch, so the validation code never comes from the pull request.
      - name: Checkout validation scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate request
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { runSnapshotValidation } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/snapshot-request.mjs`);
            await runSnapshotValidation({ github, context, core });

  snapshot:
    name: Publish Snapshot
    needs: validate
    if: needs.validate.outputs.kind == 'allowed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: snapshot-publish-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    environment:
      name: npm-publish
      url: https://npmjs.com/package/@dr_nikson/effect-grpc
    permissions:
      actions: read
      contents: read
      id-token: write # npm trusted publishing with provenance
      pull-requests: read # changelog-github looks up pull requests
    outputs:
      version: ${{ steps.publish.outputs.version }}
    env:
      SNAPSHOT_TAG: ${{ needs.validate.outputs.tag }}
      SNAPSHOT_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      # No dependency cache: this job runs pull request code, and a cache it saved would be
      # restored by default-branch runs.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate.outputs.artifact }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.validate.outputs.run-id }}

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la packages/*/dist || (echo "❌ dist folders not found" && exit 1)
          ls -la packages/*/bin || echo "⚠️  bin folders not found (may not exist)"
          echo "✅ Build artifacts restored successfully"

      # changesets refuses --snapshot in pre mode.
      - name: Version snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f .changeset/pre.json ]]; then
            pnpm exec changeset pre exit
          fi
          pnpm exec changeset version --snapshot "$SNAPSHOT_TAG"
          VERSION=$(node -p "require('./packages/effect-grpc/package.json').version")
          if [[ "$VERSION" != "0.0.0-$SNAPSHOT_TAG-$SNAPSHOT_SHA" ]]; then
            echo "::error::The snapshot version is not 0.0.0-$SNAPSHOT_TAG-$SNAPSHOT_SHA"
            exit 1
          fi
          echo "Snapshot version: $VERSION"

      - name: Publish snapshot
        id: publish
        run: |
          pnpm exec changeset publish --tag "$SNAPSHOT_TAG"
          echo "version=0.0.0-$SNAPSHOT_TAG-$SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"

      - name: Output to console
        if: github.event_name == 'workflow_dispatch'
        env:
          SNAPSHOT_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          echo "✅ Snapshot published!"
          echo "Version: $SNAPSHOT_VERSION"
          echo "Tag: $SNAPSHOT_TAG"
          echo "Install with: pnpm add @dr_nikson/effect-grpc@$SNAPSHOT_TAG"

  reply:
    name: Reply on the pull request
    needs: [validate, snapshot]
    if: always() && needs.validate.outputs.reply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REFUSAL: ${{ needs.validate.outputs.message }}
          RESULT: ${{ needs.snapshot.result }}
          SNAPSHOT_TAG: ${{ needs.validate.outputs.tag }}
          SNAPSHOT_VERSION: ${{ needs.snapshot.outputs.version }}
        with:
          script: |
            const { REFUSAL, RESULT, SNAPSHOT_TAG, SNAPSHOT_VERSION } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (REFUSAL) {
              body = `❌ ${REFUSAL}`;
            } else if (RESULT === 'success') {
              body = [
                '## 🚀 Snapshot Published!',
                '',
                `**Version:** \`${SNAPSHOT_VERSION}\``,
                `**Tag:** \`${SNAPSHOT_TAG}\``,
                '',
                '### Install:',
                '```bash',
                `pnpm add @dr_nikson/effect-grpc@${SNAPSHOT_TAG}`,
                '# or',
                `npm install @dr_nikson/effect-grpc@${SNAPSHOT_TAG}`,
                '```',
                '',
                '### Using specific version:',
                '```bash',
                `pnpm add @dr_nikson/effect-grpc@${SNAPSHOT_VERSION}`,
                '```',
                '',
                'This snapshot will be available until a newer version is published.',
              ].join('\n');
            } else {
              body = `❌ Snapshot publish ${RESULT === 'cancelled' ? 'was cancelled' : 'failed'}. Check the [workflow run](${runUrl}) for details.`;
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
