syntax = "proto3";

package com.example.v1;

// One method of each kind. The tests implement it by hand, because protoc-gen-effect generates
// unary methods only.
service StreamingTestService {
  rpc Unary(Chunk) returns (Chunk);
  rpc ServerStream(Chunk) returns (stream Chunk);
  rpc ClientStream(stream Chunk) returns (Chunk);
  rpc Bidi(stream Chunk) returns (stream Chunk);
}

message Chunk {
  string data = 1;
}
